<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#7b1e1e">

  <title>火晶建築 必要素材計算機</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="container">

    <header class="hero">

      <p class="hero-label">
        WHITEOUT SURVIVAL TOOL
      </p>

      <h1>
        🔥 火晶建築 必要素材計算機
      </h1>

      <p class="hero-description">
        育成したい施設を複数選択して、
        必要な火晶と精錬火晶を計算できます。
      </p>

    </header>


    <section class="settings-card">

      <label class="requirement-switch">

        <span class="switch-text">

          <strong>
            前提施設を含める
          </strong>

          <small>
            不足している大使館・大溶鉱炉を自動追加します
          </small>

        </span>

        <input
          type="checkbox"
          id="includeRequirements"
          checked
        >

      </label>


      <div class="top-buttons">

        <button
          type="button"
          id="selectAllButton"
          class="small-button"
        >
          すべて選択
        </button>

        <button
          type="button"
          id="clearAllButton"
          class="small-button"
        >
          すべて解除
        </button>

        <button
          type="button"
          id="shareButton"
          class="small-button share-button"
        >
          入力状態を共有
        </button>

      </div>

      <p
        id="shareMessage"
        class="share-message"
      ></p>

    </section>


    <section class="building-heading">

      <div>

        <h2>
          施設を選択
        </h2>

        <p id="selectedCount">
          0施設選択中
        </p>

      </div>

    </section>


    <section
      id="buildingList"
      class="building-list"
    ></section>


    <section class="summary-card">

      <h2>
        必要素材合計
      </h2>

      <div class="material-grid">

        <article class="material-card">

          <div class="material-icon crystal-icon">
            ◆
          </div>

          <div class="material-information">

            <span>
              火晶
            </span>

            <strong id="totalCrystal">
              0
            </strong>

          </div>

        </article>


        <article class="material-card">

          <div class="material-icon refined-icon">
            ⌛
          </div>

          <div class="material-information">

            <span>
              精錬火晶
            </span>

            <strong id="totalRefined">
              0
            </strong>

          </div>

        </article>

      </div>


      <p
        id="calculationNote"
        class="calculation-note"
      >
        施設を選択してください
      </p>

    </section>


    <section class="route-card">

      <h2>
        計算に含まれる育成
      </h2>

      <div id="routeList">

        <p class="route-empty">
          施設を選択すると表示されます
        </p>

      </div>

    </section>


    <button
      type="button"
      id="resetButton"
      class="reset-button"
    >
      入力内容をすべてリセット
    </button>


    <p class="footer-note">

      ※ 段階表示はすべて1/5〜4/5で統一しています。<br>

      ※ 5段階目が完了すると、次の火晶レベルになります。<br>

      ※ 例：火晶Lv5 4/5 → 火晶Lv6<br>

      ※ 入力内容はこの端末に自動保存されます。

    </p>

  </main>


  <script src="./script.js"></script>

</body>
</html>
